name: HelpDeskHQ CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk_test_password
          POSTGRES_DB: helpdeskhq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdeskhq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5004
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: helpdesk
      DB_PASSWORD: helpdesk_test_password
      DB_NAME: helpdeskhq_test
      JWT_SECRET: github_actions_test_secret
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: |
          for file in database/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: helpdesk
          PGPASSWORD: helpdesk_test_password
          PGDATABASE: helpdeskhq_test

      - name: Run Jest tests
        run: npm test